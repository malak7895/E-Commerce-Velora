
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VELORA | Shop</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar">

        <a href="index.html" class="logo">VELORA</a>

        <div class="nav-links">

            <a href="index.html">Home</a>

            <a href="products.html" class="active">
                Shop
            </a>

            <a href="products.html?category=Women">
                Women
            </a>

            <a href="products.html?category=Men">
                Men
            </a>

            <a href="about.html">
                About
            </a>

            <a href="contact.html">
                Contact
            </a>

            <a href="cart.html">
                Cart <span id="cart-count">0</span>
            </a>

        </div>

        <button id="dark-mode"
                class="dark-mode-btn">
            ☾
        </button>

    </nav>


    <!-- Page Header -->

    <section class="page-header">

        <p class="small-title">
            VELORA COLLECTION
        </p>

        <h1>Shop</h1>

        <p>
            Find your next favorite piece.
        </p>

    </section>


    <!-- Products -->

    <section class="section">

        <div class="shop-controls">

            <input
                type="text"
                id="search-input"
                placeholder="Search products..."
            >

            <select id="category-filter">

                <option value="All">
                    All Categories
                </option>

                <option value="Women">
                    Women
                </option>

                <option value="Men">
                    Men
                </option>

                <option value="Streetwear">
                    Streetwear
                </option>

                <option value="Accessories">
                    Accessories
                </option>

            </select>

        </div>


        <div id="products-container"
             class="product-grid">

            <!-- JavaScript -->

        </div>

    </section>


    <!-- Product Modal -->

    <div id="product-modal"
         class="modal">

        <div class="modal-content">

            <button id="close-modal"
                    class="close-modal">
                ×
            </button>

            <img id="modal-image"
                 src=""
                 alt="Product">

            <div class="modal-info">

                <p id="modal-category"
                   class="small-title">
                </p>

                <h2 id="modal-name"></h2>

                <p id="modal-description"></p>

                <h3>
                    $<span id="modal-price"></span>
                </h3>

                <button id="modal-add"
                        class="main-btn">
                    Add to Cart
                </button>

            </div>

        </div>

    </div>


    <!-- Message -->

    <div id="message-box"></div>


    <footer>

        <div class="footer-top">

            <div>
                <h2>VELORA</h2>
                <p>
                    Everyday fashion with a little
                    Egyptian attitude.
                </p>
            </div>

            <div class="footer-links">

                <a href="products.html">Shop</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
                <a href="cart.html">Cart</a>

            </div>

        </div>

        <div class="footer-bottom">

            <p>© 2026 VELORA</p>

            <p>Made with style in Egypt.</p>

        </div>

    </footer>


    <script src="script.js"></script>

</body>
</html>
